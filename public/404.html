<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Redirect</title>
    <script type="text/javascript">
        // SPA Redirect for GitHub Pages
        // This is a workaround for client-side routing in single-page applications
        // When GitHub Pages returns a 404 for a path that doesn't exist, it serves this file
        // We then redirect to the index.html with the original path as a query parameter

        const path = window.location.pathname;
        const params = new URLSearchParams();

        // Store the path that was requested (remove any .html extension and leading slash)
        const pathToStore = path.replace(/\/$/, '').replace(/\/[^/]*\.html$/, '') || '/';

        // Only redirect if the path doesn't end with a file extension
        // This allows other static files to work normally
        if (!path.match(/\.[a-z0-9]+$/i)) {
            // Redirect to index with the path stored
            window.location.replace('/index.html?redirect=' + encodeURIComponent(pathToStore));
        }
    </script>
</head>

<body>
</body>

</html>
